<circle id="peer-4" cx="218" cy="311.818" r="12"/>
<circle id="peer-5" cx="180" cy="246" r="12"/>
</g><circle id="repair-signal" class="traveler" r="11" fill="#51ff0d" opacity="0"><animateMotion dur="4.2s" keyPoints="0;0;1;1" keyTimes="0;.06;.94;1" calcMode="linear" fill="freeze"><mpath href="#signal-path"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="4.2s" fill="freeze"/></circle></svg>