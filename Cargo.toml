[workspace]
resolver = "3"
members = ["urma-node", "urma-node-app/src-tauri"]

[workspace.package]
version = "0.7.3"
edition = "2024"
license = "0BSD"
authors = ["Cristian Zmole <urma@rosint.org>"]
homepage = "https://urma.rosint.org"
repository = "https://github.com/urma-protocol/urma-node"

[workspace.dependencies]
urma-chain = { version = "0.3.0" }
urma-core = { version = "0.3.0" }
urma-io = { version = "0.3.3" }
urma-names = { version = "0.3.0" }
urma-node-client = { version = "0.5.1" }
urma-runtime = { version = "0.3.4" }
urma-wire = { version = "0.3.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
