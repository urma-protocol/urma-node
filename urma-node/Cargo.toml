[package]
name = "urma-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "README.md"
description = "Optional URMA archive node: Litecoin follower, record archive, libp2p overlay and loopback service"
keywords = ["urma", "litecoin", "archive", "libp2p", "node"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
include = ["Cargo.toml", "src/**", "contrib/**", "README.md", "LICENSE"]

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
urma-chain.workspace = true
urma-core.workspace = true
urma-runtime.workspace = true
urma-io.workspace = true
urma-wire.workspace = true
urma-names.workspace = true
urma-node-client.workspace = true
hex = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rand = "0.8"
libp2p = { version = "=0.56.0", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "request-response", "macros", "ed25519", "dns", "identify"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"
sha1 = "0.10"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
