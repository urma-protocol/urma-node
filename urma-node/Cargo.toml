[package]
name = "urma-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Optional URMA archive engine and background service"

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
urma-chain.workspace = true
urma-core.workspace = true
urma-runtime.workspace = true
urma-io.workspace = true
urma-wire.workspace = true
urma-names.workspace = true
urma-node-client.workspace = true
hex = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rand = "0.8"
libp2p = { version = "=0.56.0", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "request-response", "macros", "ed25519", "dns", "identify"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
