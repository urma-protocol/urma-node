name: setup
description: Rust, Node, pnpm, Linux WebKit headers and the built frontend
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - uses: pnpm/action-setup@v4
      with:
        version: 11
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: urma-node-app/pnpm-lock.yaml
    - shell: bash
      working-directory: urma-node-app
      run: |
        pnpm install --frozen-lockfile
        pnpm build
